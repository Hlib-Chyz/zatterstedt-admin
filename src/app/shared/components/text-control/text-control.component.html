<div class="form-group">
    <label [for]="controlName()">{{ label() }}:</label>
    <input
        [id]="controlName()"
        [type]="type()"
        [formControlName]="controlName()"
        [placeholder]="'Enter ' + label()" />
    @let control = parentFormGroup.controls[controlName()];
    @if (control) {
        <app-error-messages
            [touched]="control.invalid && control.touched"
            [errors]="control.errors" />
    }
</div>
