<form [formGroup]="form()">
    <ng-container formArrayName="job">
        <ul>
            @for (job of form().controls.job.controls; track job.getRawValue().id) {
                <li [formGroupName]="$index">
                    <app-text-control label="Name" controlName="name" />
                    <app-text-control label="Cost" controlName="cost" type="number" />
                    <app-text-control label="Date" controlName="date" type="date" />
                    <button class="link" (click)="removeJob($index)">Remove</button>
                </li>
            }
        </ul>
        <button class="link" (click)="addJob()">Add</button>
    </ng-container>
</form>
